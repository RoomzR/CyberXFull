    var sg=new THREE.PointLight(zd.light,.6,4);sg.position.set(0,1.87,-.15);g.add(sg);
    g.add(Object.assign(new THREE.Mesh(GG.kb,MM.drk),{position:new THREE.Vector3(0,.9,.18)}));

    var rgb=new THREE.Mesh(new THREE.BoxGeometry(.7,.009,.01),new THREE.MeshStandardMaterial({color:0x3300aa,emissive:0x3300aa,emissiveIntensity:3}));
    rgb.position.set(0,.913,.07);g.add(rgb);
    g.add(Object.assign(new THREE.Mesh(GG.seat,MM.chr),{position:new THREE.Vector3(0,.5,.88)}));
    g.add(Object.assign(new THREE.Mesh(GG.back,MM.chr),{position:new THREE.Vector3(0,.88,1.18)}));

    var ld=document.createElement('div');ld.className='lbl';ld.textContent='#'+pc.id;
    var lo=new CSS2DObject(ld);lo.position.set(0,3,-.3);g.add(lo);
    scene.add(g);
    stations.push({pc:pc,scr:scr,sMat:sMat,dMat:dMat,eMat:eMat,sg:sg,rgb:rgb,ld:ld,eb:zd.emi,lb:zd.light});
  });

  /* ─── PARTICLES ─── */
  var NP=1500,pP=new Float32Array(NP*3),pC=new Float32Array(NP*3),pV=new Float32Array(NP);
  var NC=[[0,.55,1],[.5,0,1],[1,0,.45],[0,.8,.4],[.6,.2,1]];
  for(var i=0;i<NP;i++){pP[i*3]=(Math.random()-.5)*60-6;pP[i*3+1]=Math.random()*RH;pP[i*3+2]=(Math.random()-.5)*56;pV[i]=.003+Math.random()*.005;var c=NC[i%NC.length];pC[i*3]=c[0];pC[i*3+1]=c[1];pC[i*3+2]=c[2];}
  var pG=new THREE.BufferGeometry();pG.setAttribute('position',new THREE.BufferAttribute(pP,3));pG.setAttribute('color',new THREE.BufferAttribute(pC,3));
  scene.add(new THREE.Points(pG,new THREE.PointsMaterial({size:.06,vertexColors:true,transparent:true,opacity:.7,sizeAttenuation:true})));

  /* ─── INTERACTION ─── */
  var rc=new THREE.Raycaster(),nd=new THREE.Vector2();
  var hov=-1,pend=-1;
  var tip=document.getElementById('tooltip'),mo=document.getElementById('mo'),mt=document.getElementById('mt');
  var ZCOL={STAGE:'#0099ff',BOOTCAMP:'#00cc55',STANDART:'#aa44ff'};

  function applyH(i,on){
    if(booked[i])return;var s=stations[i];
    if(on){s.sMat.emissive.setHex(0x0055cc);s.sMat.emissiveIntensity=3;s.dMat.emissive=new THREE.Color(0x001a44);s.dMat.emissiveIntensity=.8;s.eMat.emissiveIntensity=9;s.sg.intensity=4;s.sg.color.setHex(0x0088ff);}
    else{s.sMat.emissive.setHex(s.eb);s.sMat.emissiveIntensity=.7;s.dMat.emissive=new THREE.Color(0);s.dMat.emissiveIntensity=0;s.eMat.emissiveIntensity=2.5;s.sg.intensity=.6;s.sg.color.setHex(s.lb);}
  }
  function applyBk(i){var s=stations[i];s.sMat.emissive.setHex(0x440000);s.sMat.emissiveIntensity=2;s.eMat.emissive.setHex(0x440000);s.eMat.emissiveIntensity=4;s.sg.color.setHex(0xff0000);s.sg.intensity=1.5;s.ld.classList.add('bk');}
  function applyFr(i){var s=stations[i];s.sMat.emissive.setHex(s.eb);s.sMat.emissiveIntensity=.7;s.eMat.emissive.setHex(s.eb);s.eMat.emissiveIntensity=2.5;s.sg.color.setHex(s.lb);s.sg.intensity=.6;s.ld.classList.remove('bk');}

  renderer.domElement.addEventListener('mousemove',function(e){
    nd.x=(e.clientX/innerWidth)*2-1;nd.y=-(e.clientY/innerHeight)*2+1;
    rc.setFromCamera(nd,camera);var hits=rc.intersectObjects(picks);
    if(hits.length){
      var i=hits[0].object.userData.idx;
      if(hov!==i){if(hov>=0)applyH(hov,false);hov=i;applyH(i,true);}
      var s=stations[i],zd=Z[s.pc.z];
      tip.style.display='block';
      tip.innerHTML='<b style="color:'+ZCOL[s.pc.z]+'">ПК #'+s.pc.id+' ['+s.pc.z+']</b> &nbsp;|&nbsp; '+zd.specs+' &nbsp;|&nbsp; <span style="color:#ff00cc">'+zd.price+'</span>'+(booked[i]?' &nbsp;<span style="color:#ff4444">[ЗАНЯТО]</span>':'');
      renderer.domElement.style.cursor=booked[i]?'not-allowed':'pointer';
    }else{if(hov>=0){applyH(hov,false);hov=-1;}tip.style.display='none';renderer.domElement.style.cursor='default';}
  });

  renderer.domElement.addEventListener('click',function(e){
    nd.x=(e.clientX/innerWidth)*2-1;nd.y=-(e.clientY/innerHeight)*2+1;
    rc.setFromCamera(nd,camera);var hits=rc.intersectObjects(picks);
    if(!hits.length)return;var i=hits[0].object.userData.idx;if(booked[i])return;pend=i;
    var s=stations[i],zd=Z[s.pc.z];
    mt.innerHTML='<b style="color:'+ZCOL[s.pc.z]+';font-size:15px">ПК #'+s.pc.id+' — '+s.pc.z+'</b><br><span style="font-size:10px;color:#555">'+zd.specs+'</span><br><span style="color:#ff00cc;font-size:13px;font-weight:bold">'+zd.price+'</span><br><br><span style="color:#ccc;font-size:12px">Забронировать на <b style="color:'+ZCOL[s.pc.z]+'">2 часа</b>?</span>';
    mo.style.display='flex';ctrl.enabled=false;
  });

  function closeM(){mo.style.display='none';ctrl.enabled=true;pend=-1;}
  document.getElementById('by').onclick=function(){if(pend>=0){booked[pend]=true;applyBk(pend);buildPanel();}closeM();};
  document.getElementById('bn').onclick=closeM;
  mo.addEventListener('click',function(e){if(e.target===mo)closeM();});

  /* ─── PANEL ─── */
  function buildPanel(){
    var list=document.getElementById('pl');list.innerHTML='';
    [{z:'STAGE',c:'s'},{z:'BOOTCAMP',c:'b'},{z:'STANDART',c:'st'}].forEach(function(o){
      var blk=document.createElement('div');blk.className='zg';
      var hdr=document.createElement('div');hdr.className='zh '+o.c;
      var pz=PCS.filter(function(p){return p.z===o.z;});
      var fr=pz.filter(function(_,j){return !booked[PCS.indexOf(pz[j])];}).length;
      hdr.textContent=o.z+' ('+fr+'/'+pz.length+' своб.)';blk.appendChild(hdr);
      pz.forEach(function(pc){
        var i=PCS.indexOf(pc),b=booked[i];
        var row=document.createElement('div');row.className='pr';
        row.innerHTML='<span class="pn">ПК #'+pc.id+'</span><span class="'+(b?'sb':'sf')+'">'+(b?'Занято <span class="cx" data-i="'+i+'">✕</span>':'Свободно')+'</span>';
        blk.appendChild(row);
      });
      list.appendChild(blk);
    });
    list.querySelectorAll('.cx').forEach(function(el){el.onclick=function(e){e.stopPropagation();var i=+el.dataset.i;booked[i]=false;applyFr(i);buildPanel();};});
  }
  buildPanel();

  /* ─── ANIMATION ─── */
  var clk=new THREE.Clock();
  loading.style.display='none';

  (function tick(){
    requestAnimationFrame(tick);var t=clk.getElapsedTime();
    for(var i=0;i<NP;i++){pP[i*3+1]+=pV[i];if(pP[i*3+1]>RH){pP[i*3+1]=0;pP[i*3]=(Math.random()-.5)*60-6;pP[i*3+2]=(Math.random()-.5)*56;}}
    pG.attributes.position.needsUpdate=true;
    lB.intensity=10+Math.sin(t*1.3)*3;lP.intensity=10+Math.sin(t*1.8+1)*3;
    lG.intensity=7+Math.sin(t*1.1+2.2)*2;lR.intensity=5+Math.sin(t*2+3)*1.5;
    stations.forEach(function(s,i){var h=((t*50+i*8)%360)/360;s.rgb.material.color.setHSL(h,.9,.4);s.rgb.material.emissive.setHSL(h,.9,.4);});
    ctrl.update();renderer.render(scene,camera);css2r.render(scene,camera);
  })();

  window.addEventListener('resize',function(){
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);css2r.setSize(innerWidth,innerHeight);
  });
})();
</script>
</body>
</html>
